name: Deploy to GitHub Pages

on:
  push:
    branches:
      - main

jobs:
  # Build job
  build:
    runs-on: ubuntu-latest
    permissions:
      id-token: write
      attestations: write
      contents: read
    steps:
      # Checkout the repository
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
    
      - name: Setup Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version: '22'
          cache: 'npm'

      # Install dependencies
      - name: Install dependencies
        run: npm ci

      # Generate SBOM from the dependencies (scanning the workspace directory)
      - name: Generate SBOM
        uses: anchore/sbom-action@3ad7283483fc7af8ff2b4ea19663c2d5ca935e26
        with:
          upload-artifact: false
          upload-release-assets: false
          format: 'spdx-json'
          output-file: 'sbom.spdx.json'

      # Build the site using the build script in package.json with data hydration enabled
      - name: Build site with data hydration
        run: npm run build
        env:
          VITE_ENABLE_DATA_HYDRATION: 'true'

      # Package the build into a tarball so it can be easily verified
      - name: Package the build
        run: tar -czf dist.tar.gz dist

      # Commented out, as the SBOM version includes more detail.
      # - name: Attest Build Provenance
      #   uses: actions/attest-build-provenance@v1
      #   with:
      #     subject-path: "dist.tar.gz"

      # Complete an attestation of the SBOM and the build
      - uses: actions/attest-sbom@c604332985a26aa8cf1bdc465b92731239ec6b9e
        with:
          subject-path: 'dist.tar.gz'
          sbom-path: 'sbom.spdx.json'

      # Publish the SBOM (Zipped per https://github.com/actions/upload-artifact?tab=readme-ov-file#zip-archives)
      - name: Publish the SBOM
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: sbom
          path: sbom.spdx.json

      # Publish the build
      # - name: Publish the build
      #  uses: actions/upload-artifact@v4
      #  with:
      #    name: github-pages
      #    path: dist.tar.gz
          
      - name: "Deploy to GitHub Pages"
        uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9
        with:
          path: dist

  # Deploy job
  deploy:
   # Add a dependency to the build job
   needs: build

   # Grant GITHUB_TOKEN the permissions required to make a Pages deployment
   permissions:
     pages: write      # to deploy to Pages
     id-token: write   # to verify the deployment originates from an appropriate source

   # Deploy to the github-pages environment
   environment:
     url: ${{ steps.deployment.outputs.page_url }}
     name: github-pages

   # Specify runner + deployment step
   runs-on: ubuntu-latest
   steps:
     - name: Deploy to GitHub Pages
       id: deployment
       uses: actions/deploy-pages@368f82528645a54fb793d4d04e342629a3f51346
